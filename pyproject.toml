[project]
name = "fangraphs-api-extractor"
version = "0.3.0"
description = "Fangraphs API ETL Extractor"
authors = [
    {name = "Taylor \"TP\" Pubins",email = "tpubz@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.3,<3.0.0",
    "pydantic>=2.11.4,<3.0.0",
    "tqdm>=4.67.1,<5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pdbpp>=0.11.6",
    "mypy>=1.15.0"
]

[project.scripts]
fangraphs-api-extractor = "fangraphs_api_extractor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
omit = [
    "fangraphs_api_extractor/__main__.py",
    "*/tests/*",
    "*/test_*.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
